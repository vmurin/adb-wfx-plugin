name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 14 (arm64)
            runner: macos-14
          - name: macOS 13 (x86_64)
            runner: macos-13
          - name: Linux (x86_64)
            runner: ubuntu-22.04
          - name: Linux (aarch64)
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Compiler version
        run: ${CXX:-c++} --version || c++ --version

      # Builds the plugin, runs the whole unit suite against the fake
      # transport, asserts the exported symbol table, and compiles
      # device_driver. No Android device is involved.
      - name: Unit suite
        run: ./run_tests.sh

      - name: Universal build (macOS only)
        if: startsWith(matrix.runner, 'macos')
        run: |
          ./build.sh --universal
          lipo -info fsplugin.wfx64

  version-consistency:
    name: version.h agrees with CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-version.sh
